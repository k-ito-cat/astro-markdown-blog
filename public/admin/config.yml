backend:
  name: github
  repo: k-ito-cat/blog-posts
  branch: main

media_folder: "/images/"
public_folder: "/images/"

collections:
  - name: "blog"
    label: "Blog"
    folder: "blog"
    create: true
    fields:
      - { label: タイトル, name: "title", widget: string }
      - label: 公開日
        name: "publishedAt"
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: 更新日
        name: "updatedAt"
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: サムネイル
        name: thumbnail
        widget: image
        media_folder: "/images/thumbnail"
        public_folder: "/images/thumbnail"
        default: "/images/thumbnail/noimage.webp"

      - { label: GitHub URL, name: githubUrl, widget: string, required: false }

      - label: カテゴリー
        name: categories
        widget: select
        multiple: true
        min: 1
        max: 2
        options:
          - "フロントエンド"
          - "バックエンド"
          - "Web基盤"
          - "セキュリティ"
          - "設計・アーキテクチャ"
          - "開発環境・ツール"
          - "AI"
          - "UI・UX"
          - "開発プロセス"

      - label: タグ
        name: tags
        widget: select
        multiple: true
        min: 1
        options:
          - "HTML"
          - "CSS"
          - "JavaScript"
          - "TypeScript"
          - "Markdown"
          - "Mermaid"
          - "Astro"
          - "React"
          - "React Native"
          - "Expo"
          - "Hono"
          - "Kysely"
          - "XState"
          - "Storybook"
          - "zod"
          - "Headless CMS"
          - "microCMS"
          - "Decap CMS"
          - "Sveltia CMS"
          - "Netlify"
          - "AWS"
          - "S3"
          - "PostgreSQL"
          - "Atlas"
          - "データベース"
          - "Docker"
          - "devcontainer"
          - "Nix"
          - "Devbox"
          - "mise"
          - "chezmoi"
          - "dotfiles"
          - "Neovim"
          - "WezTerm"
          - "WSL"
          - "Windows"
          - "macOS"
          - "iOS"
          - "SSH"
          - "1Password"
          - "環境変数"
          - "IME"
          - "リンター"
          - "ESLint"
          - "Obsidian"
          - "Git"
          - "GitHub"
          - "GitHub Actions"
          - "CI/CD"
          - "コミット"
          - "バージョニング"
          - "npm"
          - "MCP"
          - "Notion"
          - "Cursor"
          - "AI活用"
          - "ブラウザ"
          - "Chrome"
          - "HTTP"
          - "TLS"
          - "REST API"
          - "キャッシュ"
          - "SSR"
          - "SEO"
          - "パフォーマンス"
          - "Core Web Vitals"
          - "バンドル"
          - "ビルド"
          - "画像"
          - "フォント"
          - "SVG"
          - "ディスプレイ"
          - "ハードウェア"
          - "UIデザイン"
          - "UIスタック"
          - "デザインシステム"
          - "アクセシビリティ"
          - "フォーム"
          - "ページネーション"
          - "認証・認可"
          - "JWT"
          - "Cookie"
          - "プライバシー"
          - "サプライチェーン"
          - "モノレポ"
          - "ディレクトリ設計"
          - "型安全"
          - "コーディング規約"
          - "テスト"
          - "負荷テスト"
          - "監視"
          - "GA4"
          - "Sentry"
          - "アルゴリズム"
          - "数学"
          - "レビュー"
          - "見積もり"
          - "ドキュメント"
          - "生産性"
          - "プロダクト設計"
          - "用語"
          - "検証"

      - label: 公開ステータス
        name: status
        widget: select
        options:
          - "private"
          - "draft"
          - "published"
        default: "private"

      - label: 執筆ステータス
        name: writingStatus
        widget: select
        options:
          - "writing"
          - "planned"
          - "todo"
          - "done"
        default: "todo"

      - label: 優先度
        name: priority
        widget: select
        options:
          - "high"
          - "medium"
          - "low"
          - "none"
        default: "none"

      - label: 検証状態
        name: verificationStatus
        widget: select
        required: false
        options:
          - { label: 検証中, value: "in_progress" }
          - { label: 検証済, value: "verified" }
          - { label: 要再検証, value: "needs_review" }

      - label: 記録同士の関係
        name: relations
        widget: object
        required: false
        collapsed: true
        fields:
          - label: 前提
            name: prerequisites
            widget: list
            required: false
            field: { label: 記録slug, name: slug, widget: string }
          - label: 関連
            name: related
            widget: list
            required: false
            field: { label: 記録slug, name: slug, widget: string }
          - label: 発展
            name: developments
            widget: list
            required: false
            field: { label: 記録slug, name: slug, widget: string }
          - label: 置換
            name: replacements
            widget: list
            required: false
            field: { label: 記録slug, name: slug, widget: string }

      - label: 改訂履歴
        name: revisions
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.date}} — {{fields.summary}}"
        fields:
          - label: 改訂日
            name: date
            widget: datetime
            date_format: "YYYY-MM-DD"
            time_format: false
          - { label: 変更内容, name: summary, widget: string }

      - label: 本文
        name: body
        widget: markdown
        media_folder: "/images"
        public_folder: "/images"
